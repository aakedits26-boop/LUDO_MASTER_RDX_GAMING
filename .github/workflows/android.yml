name: Build Ludo Master APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir app
          unzip -o Ludo-Master-RDX-Gaming-Android.zip -d app

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install packages
        working-directory: app
        run: npm install

      - name: Install Android platform
        working-directory: app
        run: npm install @capacitor/android@7.4.3

      - name: Create Android project
        working-directory: app
        run: npx cap add android

      - name: Build APK
        working-directory: app
        run: npm run build && npx cap sync android && cd android && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ludo-Master-APK
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
